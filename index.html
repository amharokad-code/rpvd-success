<!DOCTYPE html>
<html lang="fr">
  <head>

    <!-- Open Graph / Twitter : sans ça, un lien partagé (SMS, WhatsApp, Facebook) n'affiche

    <meta property="og:site_name" content="RPVD Success" />
    <meta property="og:title" content="Bootcamp RPVD — la démarche, la veille de l'examen" />
    <meta
      property="og:description"
      content="1 h 30 en direct en ligne, le dimanche, pour maîtriser la démarche de ton chapitre avant l'examen. Maths, sciences, chimie, physique, français. Sec 1 à 5. 20 $ tout inclus."
    />
    <meta property="og:url" content="https://rpvdsuccess.com/" />
    <meta property="og:image" content="https://rpvdsuccess.com/icons/icon-512.png" />
    <meta name="twitter:card" content="summary" />
    <meta name="twitter:title" content="Bootcamp RPVD — la démarche, la veille de l'examen" />

      name="twitter:description"
      content="1 h 30 en direct en ligne, le dimanche, pour maîtriser la démarche de ton chapitre avant l'examen. Maths, sciences, chimie, physique, français. Sec 1 à 5. 20 $ tout inclus."
    />

    <!-- Icônes du site -->
    <link rel="icon" type="image/svg+xml" href="/icons/icon.svg" />
    <link rel="icon" type="image/png" sizes="192x192" href="/icons/icon-192.png" />
    <link rel="apple-touch-icon" href="/icons/icon-192.png" />

    <!-- Polices : Space Grotesk (titres, rebrand pyramide), Inter (corps), Fira Code (formules) -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@700;800&family=Inter:wght@400;500;600;700&family=Fira+Code:wght@500;700&display=swap"
    />

    <!-- Google Analytics (gtag.js) : chargé SEULEMENT après « Tout accepter » dans le bandeau de
         cookies (Loi 25, art. 8.1 : tout traceur est désactivé par défaut). Le choix est lu dans
         localStorage (rpvd_cookie_consent, voir src/utils/consent.js) ; sans consentement, aucun
         script Google n'est téléchargé. -->
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      gtag('consent', 'default', { analytics_storage: 'denied', ad_storage: 'denied', ad_user_data: 'denied', ad_personalization: 'denied' });
      window.rpvdLoadAnalytics = function () {
        if (window.__rpvdGaLoaded) return;
        window.__rpvdGaLoaded = true;
        gtag('consent', 'update', { analytics_storage: 'granted', ad_storage: 'granted', ad_user_data: 'granted', ad_personalization: 'granted' });
        var s = document.createElement('script');
        s.async = true;
        s.src = 'https://www.googletagmanager.com/gtag/js?id=G-5B2CZETWYS';
        document.head.appendChild(s);
        gtag('js', new Date());
        gtag('config', 'G-5B2CZETWYS');
      };
      try {
        var c = JSON.parse(localStorage.getItem('rpvd_cookie_consent') || 'null');
        if (c && c.marketing) window.rpvdLoadAnalytics();
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>

    <!-- Formulaire statique caché : Netlify scanne le HTML au build, pas le DOM rendu par React,
         donc ce doublon (mêmes name/champs que src/pages/LegalContactPage.jsx) est nécessaire
         pour que Netlify Forms détecte "legal-contact" et capte les soumissions AJAX réelles. -->
    <form name="legal-contact" data-netlify="true" hidden>
      <input type="email" name="email" />
      <select name="type">
        <option value="access" />
        <option value="portability" />
        <option value="withdraw" />
        <option value="delete" />
        <option value="rectify" />
        <option value="parental" />
        <option value="breach" />
        <option value="other" />
      </select>
      <textarea name="message"></textarea>
    </form>
  </body>
</html>

<!DOCTYPE html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>RPVD Success</title>
    <meta
      name="description"
      content="Photographie ton exercice et comprends le pattern derrière la solution — en trois niveaux, expliqué comme par un ami."
    />
    <meta name="theme-color" content="#000000" />
    <meta name="color-scheme" content="dark" />

    <!-- PWA -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" type="image/svg+xml" href="/icons/icon.svg" />
    <link rel="icon" type="image/png" sizes="192x192" href="/icons/icon-192.png" />
    <link rel="apple-touch-icon" href="/icons/icon-192.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="RPVD" />
    <meta name="mobile-web-app-capable" content="yes" />

    <!-- Polices : Space Grotesk (titres, rebrand pyramide), Inter (corps), Fira Code (formules) -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@700;800&family=Inter:wght@400;500;600;700&family=Fira+Code:wght@500;700&display=swap"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>

    <!-- Formulaire statique caché : Netlify scanne le HTML au build, pas le DOM rendu par React,
         donc ce doublon (mêmes name/champs que src/pages/LegalContactPage.jsx) est nécessaire
         pour que Netlify Forms détecte "legal-contact" et capte les soumissions AJAX réelles. -->
    <form name="legal-contact" data-netlify="true" hidden>
      <input type="email" name="email" />
      <select name="type">
        <option value="access" />
        <option value="delete" />
        <option value="rectify" />
        <option value="parental" />
        <option value="breach" />
        <option value="other" />
      </select>
      <textarea name="message"></textarea>
    </form>
  </body>
</html>

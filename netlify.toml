[build]
command = "npm run build"
functions = "netlify/functions"
publish = "dist"

[functions]
node_bundler = "esbuild"
included_files = ["netlify/functions/_lib/**"]

[dev]
command = "npm run dev"
port = 5173

[[redirects]]
from = "/*"
to = "/index.html"
status = 200

# Bootcamp RPVD : sélection du jeudi, liens Zoom T-60 min, places libérées, suivi (voir la fonction).
[functions."bootcamp-cron"]
schedule = "*/10 * * * *"

# Capsules RPVD : sequence courriel des demandes (1x/jour, 12 h UTC = 8 h au Quebec).
[functions."capsule-cron"]
schedule = "0 12 * * *"

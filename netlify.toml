[build]
command = "npm run build"
functions = "netlify/functions"
publish = "dist"

[functions]
node_bundler = "esbuild"
included_files = ["netlify/functions/_lib/**"]

[dev]
command = "npm run dev"
port = 5173

[[redirects]]
from = "/*"
to = "/index.html"
status = 200

# Netlify sert .webmanifest en application/octet-stream par défaut (extension inconnue) — Chrome
# exige un type JSON pour considérer le manifeste valide et proposer l'installation (PWA §critère).
[[headers]]
for = "/manifest.webmanifest"
[headers.values]
Content-Type = "application/manifest+json"
